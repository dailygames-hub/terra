<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>TERRA</title>
<meta name="description" content="TERRA: indovina il paese del giorno in 8 tentativi confrontando continente, popolazione, superficie, ricchezza e altro.">
<meta name="theme-color" content="#dfe7ec">
<meta property="og:title" content="TERRA">
<meta property="og:description" content="Indovina il paese del giorno in 8 tentativi confrontando continente, popolazione, superficie, ricchezza e altro.">
<meta property="og:type" content="website">
<link rel="icon" href="favicon.svg">
<style>
@font-face{ font-family:"Familjen"; src:url("fonts/Familjen.woff2") format("woff2"); font-weight:400 700; font-style:normal; font-display:swap; }
:root{
  --bg:#dfe7ec; --panel:#f3f6f8; --card:#ffffff; --ink:#172433; --muted:#5f6f7e; --line:#c4d0d8; --line-2:#dbe3e8;
  --green:#2f8f5b; --green-bg:#d5f0e0; --red:#c94a3b; --red-bg:#f6dcd8; --grey-bg:#e6ecf0; --accent:#e2792b;
  --font:"Familjen","Helvetica Neue",Arial,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
html,body{height:100%;margin:0}
body{background:var(--bg); background-image:radial-gradient(circle at 20% 0%, #eaf1f5 0, transparent 55%); color:var(--ink); font-family:var(--font); font-weight:400; font-size:16px; display:flex; flex-direction:column; align-items:center; -webkit-tap-highlight-color:transparent}
button,input{font-family:inherit; color:inherit}
button{cursor:pointer; touch-action:manipulation}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid var(--accent); outline-offset:2px}
a{color:var(--ink)}

#app{width:100%; max-width:600px; height:100%; display:flex; flex-direction:column; padding:0 10px 8px}

/* header */
.top{display:flex; align-items:center; gap:8px; padding:10px 2px 6px; flex:0 0 auto}
.logo{display:flex; align-items:center; gap:8px; font-weight:700; font-size:22px; letter-spacing:.08em; flex:0 0 auto}
.logo svg{width:26px;height:26px;display:block}
.meta{flex:1 1 auto; min-width:0; line-height:1.15; padding-left:2px}
.meta b{display:block; font-weight:700; font-size:13px; letter-spacing:.06em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.meta span{display:block; font-size:12px; color:var(--muted); letter-spacing:.03em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.iconbtn{width:40px;height:40px;border:0;background:transparent;border-radius:10px;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.iconbtn:active{background:var(--line-2)}
.iconbtn svg{width:24px;height:24px;fill:var(--ink)}

/* summary */
.summary{background:var(--panel); border:1px solid var(--line-2); border-radius:14px; padding:10px 10px 8px; flex:0 0 auto}
.summary h4{margin:0 0 8px; font-size:11px; font-weight:700; letter-spacing:.12em; color:var(--muted)}
.sumgrid{display:grid; grid-template-columns:repeat(3, minmax(0, 1fr)); gap:6px}
.chip{background:var(--card); border:1px solid var(--line-2); border-radius:10px; padding:6px 8px; min-height:44px; min-width:0; display:flex; flex-direction:column; justify-content:center}
.chip small{font-size:10px; letter-spacing:.08em; color:var(--muted); font-weight:700; display:block; margin-bottom:2px}
.chip b{font-size:13px; font-weight:700; line-height:1.2; overflow-wrap:anywhere}
.chip b.dim{color:var(--muted); font-weight:400}
.chip.ok{background:var(--green-bg); border-color:transparent} .chip.ok b{color:var(--green)}
.chip s{text-decoration:line-through; color:var(--red); opacity:.85}

/* guesses */
.stage{flex:1 1 auto; min-height:0; overflow:auto; margin-top:8px; -webkit-overflow-scrolling:touch}
.hdr{display:grid; grid-template-columns:repeat(9, 1fr); gap:3px; padding:0 2px 4px; position:sticky; top:0; background:var(--bg); z-index:2}
.hdr span{font-size:9px; font-weight:700; letter-spacing:.06em; color:var(--muted); text-align:center; white-space:nowrap}
.guess{background:var(--card); border:1px solid var(--line-2); border-radius:12px; padding:7px 6px 6px; margin-bottom:6px; animation:in .3s ease-out both}
.guess .who{display:flex; align-items:center; gap:8px; padding:0 2px 6px; font-weight:700; font-size:15px}
.guess .who .f{font-size:20px; line-height:1}
.guess .who .n{flex:1 1 auto; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.guess .who .i{font-size:12px; color:var(--muted); font-weight:400}
.cells{display:grid; grid-template-columns:repeat(9, 1fr); gap:3px}
.cell{border-radius:7px; background:var(--grey-bg); min-height:40px; display:flex; flex-direction:column; align-items:center; justify-content:center; font-size:11px; font-weight:700; line-height:1.1; padding:3px 1px; overflow:hidden; animation:flip .45s ease-out both}
.cell .a{font-size:13px; line-height:1}
.cell.ok{background:var(--green-bg); color:var(--green)}
.cell.no{background:var(--red-bg); color:var(--red)}
.cell.win{animation:winpop .5s cubic-bezier(.34,1.56,.64,1) both}
@keyframes in{from{opacity:0; transform:translateY(8px)}to{opacity:1; transform:none}}
@keyframes flip{0%{transform:rotateX(90deg); opacity:0}100%{transform:rotateX(0); opacity:1}}
@keyframes winpop{0%{transform:scale(.7)}100%{transform:scale(1)}}
.empty{color:var(--muted); font-size:14px; text-align:center; padding:26px 10px 10px; line-height:1.5}
@media (prefers-reduced-motion: reduce){.guess,.cell,.cell.win{animation:none}}

/* input */
.inputbar{flex:0 0 auto; padding-top:8px; position:relative}
.inputbar input{width:100%; border:1.5px solid var(--line); background:var(--card); border-radius:12px; padding:13px 44px 13px 14px; font-size:16px; font-weight:400}
.inputbar input::placeholder{color:var(--muted)}
.inputbar input:disabled{opacity:.6}
.inputbar .go{position:absolute; right:6px; top:14px; width:36px; height:36px; border:0; border-radius:9px; background:var(--ink); color:#fff; display:flex; align-items:center; justify-content:center}
.inputbar .go svg{width:18px;height:18px;fill:currentColor}
.inputbar .go:disabled{opacity:.3}
.sugg{position:absolute; left:0; right:0; bottom:calc(100% - 2px); background:var(--card); border:1px solid var(--line); border-radius:12px; box-shadow:0 10px 30px rgba(23,36,51,.15); overflow:hidden; display:none; z-index:20; max-height:270px; overflow-y:auto}
.sugg.open{display:block}
.sugg button{display:flex; align-items:center; gap:10px; width:100%; border:0; background:transparent; text-align:left; padding:11px 14px; font-size:16px; border-top:1px solid var(--line-2)}
.sugg button:first-child{border-top:0}
.sugg button.sel,.sugg button:hover{background:var(--panel)}
.sugg .f{font-size:20px}
.sugg .used{color:var(--muted); text-decoration:line-through}
.foot{display:flex; justify-content:center; gap:22px; padding:8px 0 0; font-size:12px; color:var(--muted); letter-spacing:.06em; flex:0 0 auto}
.foot button{border:0;background:transparent;padding:5px 4px;color:var(--muted);font-size:12px;letter-spacing:.06em}
#adslot:empty{display:none}
#adslot{width:100%; max-width:560px; margin:6px auto 0; text-align:center}

/* toast */
#toast{position:fixed; left:50%; top:calc(env(safe-area-inset-top,0px) + 66px); transform:translateX(-50%); background:var(--ink); color:#fff; padding:10px 16px; border-radius:8px; font-weight:700; font-size:14px; opacity:0; pointer-events:none; transition:opacity .18s; z-index:50; white-space:nowrap}
#toast.show{opacity:1}

/* modals */
.overlay{position:fixed; inset:0; background:rgba(23,36,51,.5); display:none; align-items:flex-end; justify-content:center; z-index:40; padding:calc(env(safe-area-inset-top,0px) + 14px) 0 0}
.overlay.open{display:flex}
.modal{width:100%; max-width:600px; max-height:100%; overflow:auto; background:var(--panel); color:var(--ink); border-radius:18px 18px 0 0; padding:14px 20px calc(20px + env(safe-area-inset-bottom,0px)); animation:up .3s cubic-bezier(.2,.9,.3,1.1)}
@media (min-width:640px){ .overlay{align-items:center; padding:20px} .modal{border-radius:18px; max-height:92vh; padding-bottom:20px} }
@keyframes up{from{transform:translateY(36px);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion: reduce){.modal{animation:none}}
.mhead{display:flex; align-items:center; justify-content:space-between; margin-bottom:6px}
.mhead h2{margin:0; font-size:22px; font-weight:700; letter-spacing:.02em}
.close{border:0;background:transparent;width:40px;height:40px;border-radius:8px;font-size:24px;font-weight:700;color:var(--muted)}
.close:active{background:var(--line-2)}
.modal h3{font-size:12px; font-weight:700; color:var(--muted); letter-spacing:.1em; margin:18px 0 8px}
.modal p{margin:8px 0; line-height:1.5; font-size:16px}
.modal p.small{font-size:14px; color:var(--muted)}
.modal ul{margin:6px 0; padding-left:20px; font-size:15px; line-height:1.5}
.seg{display:flex; border:1.5px solid var(--line); border-radius:10px; overflow:hidden; background:var(--bg)}
.seg button{flex:1; border:0; background:transparent; padding:11px 4px; font-weight:700; font-size:15px; color:var(--muted)}
.seg button + button{border-left:1.5px solid var(--line)}
.seg button.on{background:var(--ink); color:#fff}
.btn{width:100%; border:0; border-radius:12px; background:var(--ink); color:#fff; padding:14px; font-weight:700; font-size:16px; margin-top:10px}
.btn.ghost{background:transparent; color:var(--ink); border:1.5px solid var(--line)}
.btn:active{filter:brightness(.9)}
.btn:disabled{opacity:.4}
.two{display:flex; gap:10px}
.center{text-align:center}
.stats{display:grid; grid-template-columns:repeat(4,1fr); gap:6px; text-align:center; margin-top:8px}
.stats b{display:block; font-size:26px; font-weight:700; line-height:1}
.stats span{font-size:12px; color:var(--muted); line-height:1.2; display:block; margin-top:4px}
.drow{display:flex; align-items:center; gap:10px; margin:5px 0; font-size:13px; font-weight:700}
.drow .bar{height:20px; background:var(--grey-bg); color:var(--ink); border-radius:3px; min-width:22px; padding:0 7px; display:flex; align-items:center; justify-content:flex-end; font-size:12px}
.drow .bar.hit{background:var(--green); color:#fff}
.modal p.result-title{font-weight:700; font-size:24px; margin:6px 0 0; text-align:center}
.modal p.result-country{font-size:34px; margin:2px 0 4px; text-align:center; font-weight:700; line-height:1.15}
.modal p.result-country small{display:block; font-size:14px; color:var(--muted); font-weight:400; margin-top:4px}
.legend{display:grid; grid-template-columns:auto 1fr; gap:8px 12px; align-items:center; margin:8px 0; font-size:15px}
.legend .cell{min-height:34px; width:46px; animation:none}
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <div class="logo"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10" fill="none" stroke="var(--ink)" stroke-width="2"/><path d="M2.5 12h19M12 2.5c3 3 3 16 0 19M12 2.5c-3 3-3 16 0 19" fill="none" stroke="var(--ink)" stroke-width="1.6"/><circle cx="12" cy="12" r="2.2" fill="#e2792b"/></svg>TERRA</div>
    <div class="meta"><b id="metaTop"></b><span id="metaBottom"></span></div>
    <button class="iconbtn" id="btnStats" aria-label="Statistiche"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 21h18v-2H3zm2-3h3V9H5zm5 0h3V4h-3zm5 0h3v-7h-3z"/></svg></button>
    <button class="iconbtn" id="btnMenu" aria-label="Menu"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18v2.2H3zm0 4.9h18v2.2H3zm0 4.9h18V18H3z"/></svg></button>
  </header>

  <section class="summary"><h4 data-t="summary"></h4><div class="sumgrid" id="summary"></div></section>

  <div class="stage">
    <div class="hdr" id="hdr"></div>
    <div id="guesses"></div>
  </div>

  <div class="inputbar">
    <div class="sugg" id="sugg" role="listbox"></div>
    <input id="q" type="text" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="">
    <button class="go" id="btnGo" aria-label="Prova"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11h12.2l-4.6-4.6L13 5l7 7-7 7-1.4-1.4 4.6-4.6H4z"/></svg></button>
  </div>
  <div class="foot"><button id="btnHelpFoot"></button><button id="btnInfoFoot"></button></div>
  <!-- Spazio pubblicità: incolla qui dentro il codice dell'annuncio -->
  <div id="adslot"></div>
</div>

<div id="toast" role="status" aria-live="polite"></div>

<div class="overlay" id="ovMenu"><div class="modal" role="dialog" aria-modal="true">
  <div class="mhead"><h2 id="menuTitle"></h2><button class="close" data-close aria-label="Chiudi">×</button></div>
  <h3 data-t="langH"></h3>
  <div class="seg" id="segLang"><button data-lang="it">Italiano</button><button data-lang="en">English</button></div>
  <h3 data-t="play"></h3>
  <button class="btn" id="btnDaily"></button>
  <button class="btn ghost" id="btnPractice"></button>
  <button class="btn ghost" id="btnHelp"></button>
</div></div>

<div class="overlay" id="ovHelp"><div class="modal" role="dialog" aria-modal="true">
  <div class="mhead"><h2 id="helpTitle"></h2><button class="close" data-close aria-label="Chiudi">×</button></div>
  <div id="helpBody"></div>
  <button class="btn" data-close id="btnGotIt"></button>
</div></div>

<div class="overlay" id="ovInfo"><div class="modal" role="dialog" aria-modal="true">
  <div class="mhead"><h2 id="infoTitle"></h2><button class="close" data-close aria-label="Chiudi">×</button></div>
  <div id="infoBody"></div>
</div></div>

<div class="overlay" id="ovStats"><div class="modal" role="dialog" aria-modal="true">
  <div class="mhead"><h2 id="statsTitle"></h2><button class="close" data-close aria-label="Chiudi">×</button></div>
  <div id="resultBox"></div>
  <div class="stats" id="statsGrid"></div>
  <h3 data-t="dist"></h3>
  <div id="dist"></div>
  <p class="small center" id="nextWord" style="margin-top:14px"></p>
  <div class="two"><button class="btn" id="btnShare"></button><button class="btn ghost" id="btnNew"></button></div>
</div></div>

<script src="data.js"></script>
<script>
/* ================= CONFIG ================= */
const NAME = "TERRA";
const SITE_URL = "https://dailygames-hub.github.io/terra/";
const EPOCH = Date.UTC(2026, 8, 27);  // 27 settembre 2026 = giorno 1
const LS = "terra:";
const TRIES = 8;
const DATA = window.TERRA_DATA;   // 193 paesi
const FIELDS = ["cont","pop","area","gdp","age","life","borders","sea","drive"];
const NUMERIC = new Set(["pop","area","gdp","age","life","borders"]);

/* ================= I18N ================= */
const T = {
  it: {
    day:"GIORNO", practice:"ALLENAMENTO", tries:(a,b)=>`TENTATIVO ${a} DI ${b}`, summary:"COSA SAI FINORA",
    menu:"Menu", langH:"LINGUA", play:"GIOCA", daily:"Paese del giorno", practiceBtn:"Allenamento con paese casuale",
    howto:"Come si gioca", info:"Info e privacy", gotIt:"Ho capito", placeholder:"Scrivi un paese...", empty:"Prova un paese qualsiasi: ogni tentativo ti dice come si confronta con quello nascosto.",
    stats:"Statistiche", played:"Giocate", wins:"Vittorie", streak:"Serie attuale", best:"Serie migliore", dist:"TENTATIVI USATI",
    next:"Prossimo paese del giorno tra", share:"Condividi", newWord:"Nuovo paese",
    won:n=>`Trovato al tentativo ${n}`, lost:"Non trovato", was:"Il paese era",
    notFound:"Paese non trovato", already:"Già provato", copied:"Risultato copiato", copyFail:"Copia non riuscita", newReady:"Nuovo paese pronto",
    shareDay:n=>`giorno ${n}`, sharePractice:"allenamento",
    f:{ cont:"CONT.", pop:"ABIT.", area:"AREA", gdp:"PIL", age:"ETÀ", life:"VITA", borders:"CONF.", sea:"MARE", drive:"GUIDA" },
    fl:{ cont:"Continente", pop:"Popolazione", area:"Superficie", gdp:"PIL pro capite", age:"Età media", life:"Aspettativa di vita", borders:"Paesi confinanti", sea:"Sbocco sul mare", drive:"Senso di guida" },
    cont:{ af:"Africa", as:"Asia", eu:"Europa", na:"Nord America", sa:"Sud America", oc:"Oceania" },
    contS:{ af:"Afr.", as:"Asia", eu:"Eur.", na:"N. Am.", sa:"S. Am.", oc:"Oce." },
    yes:"Sì", no:"No", right:"Destra", left:"Sinistra", rightS:"Dx", leftS:"Sx", not:"non", from:(a,b)=>`da ${a} a ${b}`, more:"più di", less:"meno di", unknown:"?",
    help:`
      <p>C'è un paese nascosto. Scrivi il nome di un paese qualsiasi: per ognuna delle nove caratteristiche il gioco ti dice come si confronta con quello nascosto. Hai 8 tentativi.</p>
      <div class="legend">
        <div class="cell ok"><span>Europa</span></div><div>Verde: uguale al paese nascosto.</div>
        <div class="cell no"><span>Asia</span></div><div>Rosso: diverso.</div>
        <div class="cell"><span>61 M</span><span class="a">▲</span></div><div>Freccia su: il paese nascosto ha un valore più alto.</div>
        <div class="cell"><span>61 M</span><span class="a">▼</span></div><div>Freccia giù: il paese nascosto ha un valore più basso.</div>
      </div>
      <p>Il riquadro in alto riassume quello che hai scoperto: le caratteristiche trovate, gli intervalli ricavati dalle frecce e i valori esclusi.</p>
      <p class="small">I paesi sono i 193 membri delle Nazioni Unite. Continenti secondo la classificazione ONU (Russia in Europa, Turchia e Caucaso in Asia, America Centrale e Caraibi nel Nord America). PIL pro capite a parità di potere d'acquisto. Dati CIA World Factbook 2024/2025.</p>`,
    infoBody:`
      <p>${"TERRA"} è un gioco di geografia gratuito. Il paese del giorno è lo stesso per tutti e cambia a mezzanotte; l'allenamento propone paesi casuali senza limiti.</p>
      <h3>PRIVACY</h3>
      <p class="small">Nessun account e nessun cookie di tracciamento. Progressi, statistiche e impostazioni restano nel tuo browser (localStorage) e non vengono inviati a nessun server. Informativa completa: <a href="../privacy.html">privacy</a>.</p>
      <h3>DATI E CREDITI</h3>
      <p class="small">Popolazione, età media, aspettativa di vita e PIL pro capite dal CIA World Factbook (pubblico dominio, stime 2024/2025); superficie, confini, sbocco sul mare, continenti e nomi dal progetto mledoze/countries (ODbL); senso di guida da samayo/country-json (MIT). Carattere Familjen Grotesk, licenza SIL OFL.</p>`
  },
  en: {
    day:"DAY", practice:"PRACTICE", tries:(a,b)=>`GUESS ${a} OF ${b}`, summary:"WHAT YOU KNOW SO FAR",
    menu:"Menu", langH:"LANGUAGE", play:"PLAY", daily:"Country of the day", practiceBtn:"Practice with a random country",
    howto:"How to play", info:"Info & privacy", gotIt:"Got it", placeholder:"Type a country...", empty:"Try any country: every guess tells you how it compares with the hidden one.",
    stats:"Statistics", played:"Played", wins:"Win rate", streak:"Current streak", best:"Best streak", dist:"GUESSES USED",
    next:"Next country of the day in", share:"Share", newWord:"New country",
    won:n=>`Found on guess ${n}`, lost:"Not found", was:"The country was",
    notFound:"Country not found", already:"Already tried", copied:"Result copied", copyFail:"Copy failed", newReady:"New country ready",
    shareDay:n=>`day ${n}`, sharePractice:"practice",
    f:{ cont:"CONT.", pop:"POP.", area:"AREA", gdp:"GDP", age:"AGE", life:"LIFE", borders:"BORD.", sea:"SEA", drive:"DRIVE" },
    fl:{ cont:"Continent", pop:"Population", area:"Area", gdp:"GDP per capita", age:"Median age", life:"Life expectancy", borders:"Bordering countries", sea:"Coastline", drive:"Driving side" },
    cont:{ af:"Africa", as:"Asia", eu:"Europe", na:"North America", sa:"South America", oc:"Oceania" },
    contS:{ af:"Afr.", as:"Asia", eu:"Eur.", na:"N. Am.", sa:"S. Am.", oc:"Oce." },
    yes:"Yes", no:"No", right:"Right", left:"Left", rightS:"R", leftS:"L", not:"not", from:(a,b)=>`${a} to ${b}`, more:"more than", less:"less than", unknown:"?",
    help:`
      <p>There is a hidden country. Type the name of any country: for each of the nine attributes the game tells you how it compares with the hidden one. You have 8 guesses.</p>
      <div class="legend">
        <div class="cell ok"><span>Europe</span></div><div>Green: same as the hidden country.</div>
        <div class="cell no"><span>Asia</span></div><div>Red: different.</div>
        <div class="cell"><span>61 M</span><span class="a">▲</span></div><div>Arrow up: the hidden country has a higher value.</div>
        <div class="cell"><span>61 M</span><span class="a">▼</span></div><div>Arrow down: the hidden country has a lower value.</div>
      </div>
      <p>The panel at the top sums up what you have found: matched attributes, the ranges implied by the arrows, and the values ruled out.</p>
      <p class="small">Countries are the 193 UN member states. Continents follow the UN classification (Russia in Europe, Turkey and the Caucasus in Asia, Central America and the Caribbean in North America). GDP per capita at purchasing power parity. CIA World Factbook data, 2024/2025 estimates.</p>`,
    infoBody:`
      <p>${"TERRA"} is a free geography game. The country of the day is the same for everyone and changes at midnight; practice mode offers unlimited random countries.</p>
      <h3>PRIVACY</h3>
      <p class="small">No account and no tracking cookies. Progress, statistics and settings stay in your browser (localStorage) and are never sent to a server. Full notice: <a href="../privacy.html">privacy</a>.</p>
      <h3>DATA & CREDITS</h3>
      <p class="small">Population, median age, life expectancy and GDP per capita from the CIA World Factbook (public domain, 2024/2025 estimates); area, borders, coastline, continents and names from mledoze/countries (ODbL); driving side from samayo/country-json (MIT). Familjen Grotesk typeface, SIL OFL license.</p>`
  }
};
function tr(k){ const v = T[settings.lang][k]; return v === undefined ? T.it[k] : v; }

/* ================= UTIL ================= */
function hash32(str){ let h = 2166136261 >>> 0; for (let i=0;i<str.length;i++){ h ^= str.charCodeAt(i); h = Math.imul(h, 16777619) >>> 0; } return h; }
function mulberry32(a){ return function(){ a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function seededShuffle(arr, seed){ const a = arr.slice(); const r = mulberry32(seed); for (let i=a.length-1;i>0;i--){ const j = Math.floor(r()*(i+1)); [a[i],a[j]] = [a[j],a[i]]; } return a; }
function lsGet(k, d){ try { const v = localStorage.getItem(LS + k); return v === null ? d : JSON.parse(v); } catch(e){ return d; } }
function lsSet(k, v){ try { localStorage.setItem(LS + k, JSON.stringify(v)); } catch(e){} }
function todayNumber(){ const n = new Date(); const d = Date.UTC(n.getFullYear(), n.getMonth(), n.getDate()); return Math.floor((d - EPOCH) / 86400000) + 1; }
function msToMidnight(){ const n = new Date(); const m = new Date(n.getFullYear(), n.getMonth(), n.getDate() + 1, 0, 0, 0); return m - n; }
function esc(s){ return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function norm(s){ return s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-z0-9 ]/g, " ").replace(/\s+/g, " ").trim(); }
const byId = {}; DATA.forEach(c => byId[c.id] = c);
let PERM = null;
function dailyCountry(n){ if (!PERM) PERM = seededShuffle(DATA.map(c => c.id), hash32("terra-v1")); return byId[PERM[((n - 1) % PERM.length + PERM.length) % PERM.length]]; }
function randomCountry(){ return DATA[Math.floor(Math.random() * DATA.length)]; }
function cname(c){ return settings.lang === "it" ? c.it : c.en; }
function fmtNum(v, f){
  const it = settings.lang === "it";
  const dec = (x, d) => it ? x.toFixed(d).replace(".", ",") : x.toFixed(d);
  if (f === "pop" || f === "area"){
    if (v >= 1e9) return dec(v/1e9, 2) + (it ? " Mld" : " B");
    if (v >= 1e6) return dec(v/1e6, v >= 1e8 ? 0 : 1) + " M";
    if (v >= 1e3) return dec(v/1e3, v >= 1e5 ? 0 : 1) + " k";
    return String(v);
  }
  if (f === "gdp") return "$" + (v >= 1e3 ? dec(v/1e3, 1) + "k" : String(v));
  if (f === "age" || f === "life") return dec(v, 1);
  return String(v);
}
function fmtCat(c, f, short){
  if (f === "cont") return short ? tr("contS")[c.cont] : tr("cont")[c.cont];
  if (f === "sea") return c.sea ? tr("yes") : tr("no");
  if (f === "drive") return short ? tr(c.drive + "S") : tr(c.drive);
  return "";
}
function compare(g, s, f){
  if (NUMERIC.has(f)) return g[f] === s[f] ? "ok" : (s[f] > g[f] ? "up" : "down");
  return g[f] === s[f] ? "ok" : "no";
}

/* ================= STATE ================= */
const settings = Object.assign({ lang:"it", seenHelp:false }, lsGet("settings", {}));
if (!T[settings.lang]) settings.lang = "it";
let game = null, countdownTimer = null;
function saveSettings(){ lsSet("settings", settings); }
function statsKey(g){ return `stats:${g.kind}`; }
function recompute(){ game.status = game.guesses.includes(game.secret) ? "won" : (game.guesses.length >= TRIES ? "lost" : "playing"); }
function newDaily(showResult){
  const n = todayNumber();
  game = { kind:"daily", n, secret: dailyCountry(n).id, guesses:[], status:"playing" };
  const saved = lsGet(`daily:${n}`, null);
  if (saved && saved.secret === game.secret && Array.isArray(saved.guesses)) game.guesses = saved.guesses.filter(id => byId[id]);
  recompute(); render(); updateHeader();
  if (showResult && game.status !== "playing") setTimeout(openStats, 400);
}
function newPractice(){ game = { kind:"practice", n:0, secret: randomCountry().id, guesses:[], status:"playing" }; recompute(); render(); updateHeader(); toast(tr("newReady")); }
function persist(){ if (game.kind === "daily") lsSet(`daily:${game.n}`, { secret: game.secret, guesses: game.guesses }); }

/* ================= RENDER ================= */
const guessesEl = document.getElementById("guesses"), sumEl = document.getElementById("summary"), hdrEl = document.getElementById("hdr"), qEl = document.getElementById("q"), suggEl = document.getElementById("sugg");
function applyStrings(){
  document.documentElement.lang = settings.lang;
  document.querySelectorAll("[data-t]").forEach(el => el.textContent = tr(el.dataset.t));
  document.getElementById("menuTitle").textContent = tr("menu");
  document.getElementById("btnDaily").textContent = tr("daily");
  document.getElementById("btnPractice").textContent = tr("practiceBtn");
  document.getElementById("btnHelp").textContent = tr("howto");
  document.getElementById("btnHelpFoot").textContent = tr("howto");
  document.getElementById("btnInfoFoot").textContent = tr("info");
  document.getElementById("helpTitle").textContent = tr("howto");
  document.getElementById("infoTitle").textContent = tr("info");
  document.getElementById("btnGotIt").textContent = tr("gotIt");
  document.getElementById("btnShare").textContent = tr("share");
  document.getElementById("btnNew").textContent = tr("newWord");
  qEl.placeholder = tr("placeholder");
  document.querySelectorAll("#segLang button").forEach(b => b.classList.toggle("on", b.dataset.lang === settings.lang));
  hdrEl.innerHTML = FIELDS.map(f => `<span title="${esc(tr("fl")[f])}">${tr("f")[f]}</span>`).join("");
}
function updateHeader(){
  document.getElementById("metaTop").textContent = game.kind === "daily" ? `${tr("day")} ${game.n}` : tr("practice");
  document.getElementById("metaBottom").textContent = tr("tries")(Math.min(game.guesses.length + (game.status === "playing" ? 1 : 0), TRIES), TRIES);
}
function cellHTML(g, s, f, i, animate, win){
  const r = compare(g, s, f);
  const val = NUMERIC.has(f) ? fmtNum(g[f], f) : fmtCat(g, f, true);
  const arrow = r === "up" ? "▲" : r === "down" ? "▼" : "";
  return `<div class="cell ${r === "ok" ? "ok" : r === "no" ? "no" : ""}${win ? " win" : ""}" style="animation-delay:${animate ? i*60 : 0}ms" title="${esc(tr("fl")[f])}"><span>${esc(val)}</span>${arrow ? `<span class="a">${arrow}</span>` : ""}</div>`;
}
function render(animateLast){
  const s = byId[game.secret];
  if (!game.guesses.length){ guessesEl.innerHTML = `<p class="empty">${tr("empty")}</p>`; }
  else {
    guessesEl.innerHTML = game.guesses.map((id, k) => {
      const g = byId[id]; const last = k === game.guesses.length - 1; const isWin = id === game.secret;
      return `<div class="guess" style="animation-delay:0ms"><div class="who"><span class="f">${g.flag}</span><span class="n">${esc(cname(g))}</span><span class="i">${k+1}/${TRIES}</span></div><div class="cells">${FIELDS.map((f, i) => cellHTML(g, s, f, i, animateLast && last, isWin && last)).join("")}</div></div>`;
    }).reverse().join("");
  }
  renderSummary();
  qEl.disabled = game.status !== "playing"; document.getElementById("btnGo").disabled = game.status !== "playing";
}
function renderSummary(){
  const s = byId[game.secret]; const gs = game.guesses.map(id => byId[id]);
  sumEl.innerHTML = FIELDS.map(f => {
    let ok = false, text = "", dim = false;
    if (NUMERIC.has(f)){
      let lo = null, hi = null;
      for (const g of gs){ const r = compare(g, s, f); if (r === "ok"){ ok = true; lo = hi = g[f]; break; } if (r === "up") lo = lo === null ? g[f] : Math.max(lo, g[f]); else hi = hi === null ? g[f] : Math.min(hi, g[f]); }
      const unit = f === "area" ? " km²" : "";
      if (f === "borders"){ if (lo !== null) lo += 1; if (hi !== null) hi -= 1; }   // interi: estremi inclusi
      if (ok) text = fmtNum(s[f], f) + unit;
      else if (lo !== null && hi !== null) text = lo === hi ? fmtNum(lo, f) : tr("from")(fmtNum(lo, f), fmtNum(hi, f) + unit);
      else if (lo !== null) text = f === "borders" ? `${lo}+` : `${tr("more")} ${fmtNum(lo, f)}${unit}`;
      else if (hi !== null) text = f === "borders" ? `${tr("less")} ${hi + 1}` : `${tr("less")} ${fmtNum(hi, f)}${unit}`;
      else { text = tr("unknown"); dim = true; }
    } else {
      const found = gs.some(g => compare(g, s, f) === "ok");
      const wrong = [...new Set(gs.filter(g => compare(g, s, f) === "no").map(g => fmtCat(g, f)))];
      if (found) { ok = true; text = fmtCat(s, f); }
      else if (f !== "cont" && wrong.length){ ok = true; text = fmtCat(s, f); }   // binario: una risposta sbagliata rivela quella giusta
      else if (wrong.length) text = wrong.map(w => `<s>${esc(w)}</s>`).join(" ");
      else { text = tr("unknown"); dim = true; }
    }
    return `<div class="chip${ok ? " ok" : ""}"><small>${tr("fl")[f]}</small><b class="${dim ? "dim" : ""}" title="${esc(text.replace(/<[^>]+>/g, ""))}">${NUMERIC.has(f) || ok || dim ? esc(text) : text}</b></div>`;
  }).join("");
}

/* ================= INPUT ================= */
let selIdx = 0, matches = [];
function search(q){
  const n = norm(q); if (!n) return [];
  const scored = [];
  for (const c of DATA){
    const names = [cname(c), c.it, c.en, ...(c.alt || [])].map(norm);
    let score = 0;
    for (const nm of names){ if (nm === n){ score = 3; break; } if (nm.startsWith(n)) score = Math.max(score, 2); else if (nm.split(" ").some(w => w.startsWith(n))) score = Math.max(score, 1.5); else if (nm.includes(n)) score = Math.max(score, 1); }
    if (score) scored.push([score, c]);
  }
  scored.sort((a, b) => b[0] - a[0] || cname(a[1]).localeCompare(cname(b[1])));
  return scored.slice(0, 7).map(x => x[1]);
}
function renderSugg(){
  if (!matches.length){ suggEl.classList.remove("open"); suggEl.innerHTML = ""; return; }
  suggEl.innerHTML = matches.map((c, i) => `<button type="button" role="option" data-id="${c.id}" class="${i === selIdx ? "sel" : ""}${game.guesses.includes(c.id) ? " used" : ""}"><span class="f">${c.flag}</span><span>${esc(cname(c))}</span></button>`).join("");
  suggEl.classList.add("open");
}
qEl.addEventListener("input", () => { matches = search(qEl.value); selIdx = 0; renderSugg(); });
qEl.addEventListener("focus", () => { matches = search(qEl.value); renderSugg(); });
qEl.addEventListener("keydown", e => {
  if (e.key === "ArrowDown"){ selIdx = Math.min(matches.length - 1, selIdx + 1); renderSugg(); e.preventDefault(); }
  else if (e.key === "ArrowUp"){ selIdx = Math.max(0, selIdx - 1); renderSugg(); e.preventDefault(); }
  else if (e.key === "Enter"){ e.preventDefault(); submit(); }
  else if (e.key === "Escape"){ matches = []; renderSugg(); }
});
document.addEventListener("click", e => { if (!e.target.closest(".inputbar")) { matches = []; renderSugg(); } });
suggEl.addEventListener("click", e => { const b = e.target.closest("button[data-id]"); if (!b) return; guess(b.dataset.id); });
document.getElementById("btnGo").addEventListener("click", submit);
function submit(){ if (game.status !== "playing") return; const m = matches.length ? matches[selIdx] : search(qEl.value)[0]; if (!m){ toast(tr("notFound")); return; } guess(m.id); }
function guess(id){
  if (game.status !== "playing") return;
  if (game.guesses.includes(id)){ toast(tr("already")); return; }
  game.guesses.push(id); recompute(); persist();
  qEl.value = ""; matches = []; renderSugg(); qEl.blur();
  render(true); updateHeader();
  document.querySelector(".stage").scrollTop = 0;
  if (game.status !== "playing"){ recordStats(); setTimeout(openStats, 900); }
}

/* ================= TOAST & MODALS ================= */
let toastT = null;
function toast(msg){ const t = document.getElementById("toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("show"), 1600); }
function openModal(id){ document.getElementById(id).classList.add("open"); }
function closeAll(){ document.querySelectorAll(".overlay.open").forEach(o => o.classList.remove("open")); if (countdownTimer){ clearInterval(countdownTimer); countdownTimer = null; } }
document.querySelectorAll("[data-close]").forEach(b => b.addEventListener("click", closeAll));
document.querySelectorAll(".overlay").forEach(o => o.addEventListener("click", e => { if (e.target === o) closeAll(); }));
document.getElementById("btnMenu").addEventListener("click", () => { applyStrings(); openModal("ovMenu"); });
document.getElementById("segLang").addEventListener("click", e => { const b = e.target.closest("button"); if (!b) return; settings.lang = b.dataset.lang; saveSettings(); applyStrings(); render(); updateHeader(); });
document.getElementById("btnDaily").addEventListener("click", () => { closeAll(); newDaily(); });
document.getElementById("btnPractice").addEventListener("click", () => { closeAll(); newPractice(); });
document.getElementById("btnHelp").addEventListener("click", () => { closeAll(); openHelp(); });
document.getElementById("btnHelpFoot").addEventListener("click", openHelp);
document.getElementById("btnInfoFoot").addEventListener("click", () => { applyStrings(); document.getElementById("infoBody").innerHTML = tr("infoBody"); openModal("ovInfo"); });
function openHelp(){ applyStrings(); document.getElementById("helpBody").innerHTML = tr("help"); openModal("ovHelp"); }

/* ================= STATS ================= */
function loadStats(){ return Object.assign({ played:0, won:0, streak:0, best:0, dist:[0,0,0,0,0,0,0,0], lastDay:0 }, lsGet(statsKey(game), {})); }
function recordStats(){
  const s = loadStats(); s.played++;
  if (game.status === "won"){ s.won++; s.dist[game.guesses.length - 1]++; if (game.kind === "daily"){ s.streak = (s.lastDay === game.n - 1) ? s.streak + 1 : 1; s.lastDay = game.n; } else s.streak++; }
  else { s.streak = 0; if (game.kind === "daily") s.lastDay = game.n; }
  s.best = Math.max(s.best, s.streak); lsSet(statsKey(game), s);
}
function openStats(){
  applyStrings();
  const s = loadStats(); const ended = game.status !== "playing"; const c = byId[game.secret];
  const rb = document.getElementById("resultBox");
  rb.innerHTML = ended ? `<p class="result-title">${game.status === "won" ? tr("won")(game.guesses.length) : tr("lost")}</p><p class="result-country">${c.flag} ${esc(cname(c))}<small>${tr("was")}: ${esc(tr("cont")[c.cont])}, ${fmtNum(c.pop, "pop")} ${settings.lang === "it" ? "abitanti" : "people"}, ${fmtNum(c.area, "area")} km²</small></p>` : "";
  const pct = s.played ? Math.round(100 * s.won / s.played) : 0;
  document.getElementById("statsGrid").innerHTML = `<div><b>${s.played}</b><span>${tr("played")}</span></div><div><b>${pct}%</b><span>${tr("wins")}</span></div><div><b>${s.streak}</b><span>${tr("streak")}</span></div><div><b>${s.best}</b><span>${tr("best")}</span></div>`;
  const mx = Math.max(1, ...s.dist);
  document.getElementById("dist").innerHTML = s.dist.map((v, i) => { const hit = ended && game.status === "won" && game.guesses.length === i + 1; return `<div class="drow"><span style="width:12px">${i+1}</span><div class="bar${hit ? " hit" : ""}" style="width:${Math.max(8, 100 * v / mx)}%">${v}</div></div>`; }).join("");
  document.getElementById("statsTitle").textContent = game.kind === "daily" ? tr("stats") : tr("practice").charAt(0) + tr("practice").slice(1).toLowerCase();
  document.getElementById("btnShare").disabled = !ended;
  const nw = document.getElementById("nextWord");
  if (countdownTimer){ clearInterval(countdownTimer); countdownTimer = null; }
  const tick = () => { const ms = msToMidnight(); const h = Math.floor(ms/3600000), m = Math.floor(ms%3600000/60000), sec = Math.floor(ms%60000/1000); nw.innerHTML = `${tr("next")} <b>${String(h).padStart(2,"0")}:${String(m).padStart(2,"0")}:${String(sec).padStart(2,"0")}</b>`; };
  tick(); countdownTimer = setInterval(tick, 1000);
  openModal("ovStats");
}
document.getElementById("btnStats").addEventListener("click", openStats);
document.getElementById("btnNew").addEventListener("click", () => { closeAll(); newPractice(); });

/* ================= SHARE ================= */
function shareText(){
  const s = byId[game.secret];
  const what = game.kind === "daily" ? tr("shareDay")(game.n) : tr("sharePractice");
  const score = game.status === "won" ? `${game.guesses.length}/${TRIES}` : `X/${TRIES}`;
  const E = { ok:"🟩", no:"🟥", up:"⬆️", down:"⬇️" };
  const grid = game.guesses.map(id => FIELDS.map(f => E[compare(byId[id], s, f)]).join("")).join("\n");
  return `${NAME} ${what} ${score}\n${grid}${SITE_URL ? "\n" + SITE_URL : ""}`;
}
document.getElementById("btnShare").addEventListener("click", async () => {
  const text = shareText();
  try { if (navigator.share){ await navigator.share({ text }); return; } } catch(e){ if (e && e.name === "AbortError") return; }
  try { await navigator.clipboard.writeText(text); toast(tr("copied")); }
  catch(e){ const ta = document.createElement("textarea"); ta.value = text; document.body.appendChild(ta); ta.select(); try { document.execCommand("copy"); toast(tr("copied")); } catch(err){ toast(tr("copyFail")); } ta.remove(); }
});

/* ================= START ================= */
applyStrings();
newDaily(true);
if (!settings.seenHelp){ settings.seenHelp = true; saveSettings(); openHelp(); }
</script>
